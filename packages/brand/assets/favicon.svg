<!--
  Promoted — favicon. Drawn on a filled tile rather than transparent so the
  mark holds up in both light and dark browser chrome. Strokes are thickened
  ~15% versus the master mark to survive 16px rasterisation.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Promoted">
  <title>Promoted</title>
  <rect width="64" height="64" rx="14" fill="#0A0C12"/>
  <g transform="translate(32 33.75) scale(0.78) translate(-32 -33.75)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M15 35 L32 18 L49 35" stroke="#D8FF3E" stroke-width="10.5"/>
    <path d="M20 50 L32 38 L44 50" stroke="#3A63FF" stroke-width="9.5"/>
  </g>
</svg>
