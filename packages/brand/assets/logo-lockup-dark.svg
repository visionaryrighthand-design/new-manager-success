<!--
  New Manager Success — horizontal lockup for DARK backgrounds.

  Mark, a hairline rule, then the two-line wordmark: NEW MANAGER in white
  above SUCCESS in blue, tracked out so both lines optically align to the
  same width. This is the arrangement in the supplied artwork.

  ⚠ PROVISIONAL, twice over:
   1. The mark is an interpretation — see logo-mark.svg.
   2. The wordmark is live <text> in a system stack. The original uses a
      heavy condensed grotesk. Before ANY external use, set it in the real
      face and convert to outlines, or it will re-flow on a machine without
      that font — which will eventually be a client's.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" fill="none" role="img" aria-label="New Manager Success">
  <title>New Manager Success</title>

  <g transform="translate(4 12) scale(1.05)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M11 54 L19.5 14 L31 44 L38.5 16" stroke="#FFFFFF" stroke-width="7.5"/>
    <path d="M35 40 C41 31 45 22 49 11" stroke="#1E6BF0" stroke-width="6.5"/>
    <path d="M38.5 15 L50.5 8.5 L52 21.5" stroke="#1E6BF0" stroke-width="6.5"/>
  </g>

  <line x1="76" y1="20" x2="76" y2="76" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>

  <text x="98" y="47"
        font-family="'Archivo', 'Anton', 'Helvetica Neue', Impact, system-ui, sans-serif"
        font-size="38" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">NEW MANAGER</text>
  <text x="99" y="82"
        font-family="'Archivo', 'Anton', 'Helvetica Neue', Impact, system-ui, sans-serif"
        font-size="31" font-weight="800" letter-spacing="10.4" fill="#1E6BF0">SUCCESS</text>
</svg>
