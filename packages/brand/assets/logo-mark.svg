<!--
  New Manager Success — primary mark.

  A brush-drawn "N" whose final upstroke is taken over by a rising arrow that
  breaks out top-right. The letterform is where you are; the arrow is where the
  job is going.

  ⚠ PROVISIONAL — a clean vector interpretation of the supplied artwork, not the
  artwork itself. The original is brush-painted with dry-brush texture and
  tapered strokes; that texture is deliberately NOT faked, because a
  hand-approximated brush reads worse than an honest clean shape. Replace with
  the source vector when it is available — see docs/brand/BRAND_GUIDE.md § The
  mark for the full list of files carrying this geometry.

  Drawn on a 64pt grid. Inked bounds: x 7.75-55, y 6.5-61.25.
  Minimum size 20px. Clear space: one N-stroke width on all sides.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="New Manager Success">
  <title>New Manager Success</title>
