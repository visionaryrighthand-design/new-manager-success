<!--
  Promoted — primary mark. "The Ascent."

  Two stacked chevrons. Read top-down it is a level-up indicator; read as a
  silhouette it is a play button tipped on its side. Promotion + video, one
  shape. Drawn on a 64pt grid with a 9pt stroke so it survives a 20px favicon.

  Minimum size: 20px. Clear space: 1x the stroke width (9/64 of the mark) on
  all sides. Never rotate, never add a third chevron, never outline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Promoted">
  <title>Promoted</title>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Leading chevron: Volt. The destination. -->
    <path d="M15 35 L32 18 L49 35" stroke="#D8FF3E" stroke-width="9"/>
    <!-- Trailing chevron: Cobalt. Where you are now. -->
    <path d="M20 50 L32 38 L44 50" stroke="#3A63FF" stroke-width="8"/>
  </g>
</svg>
