  <rect width="1024" height="1024" fill="#000000"/>
  <g transform="translate(98.66666666666669 98.66666666666669) scale(13.226666666666667)">
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M11 54 L19.5 14 L31 44 L38.5 16" stroke="#FFFFFF" stroke-width="7.5"/>
    <path d="M35 40 C41 31 45 22 49 11" stroke="#1E6BF0" stroke-width="6.5"/>
    <path d="M38.5 15 L50.5 8.5 L52 21.5" stroke="#1E6BF0" stroke-width="6.5"/>
  </g></g>
</svg>
