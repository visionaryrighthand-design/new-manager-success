<!--
  New Manager Success — app icon master, 1024x1024, for iOS and Android.
  iOS applies its own squircle mask, so the artwork is full-bleed and opaque
  (Apple rejects icons with an alpha channel). For the Android adaptive icon,
  adaptive-icon.png is the transparent foreground layer, sized to clear the
  66% safe circle; the background layer is flat #000000.

  ⚠ PROVISIONAL — regenerate from the source vector when it lands, via
  packages/brand/scripts/gen-icons.mjs.
-->
